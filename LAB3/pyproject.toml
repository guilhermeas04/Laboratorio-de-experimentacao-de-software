[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab03-dora"
version = "0.1.0"
description = "Pipeline de mineracao de metricas DORA do LAB3"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0"
]

[project.scripts]
lab03-select-repositories = "lab03_dora.pipeline.select_repositories:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
