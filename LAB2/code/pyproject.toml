[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab02-experiment"
version = "0.1.0"
description = "Infraestrutura do experimento controlado do LAB02"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib==3.10.6",
    "pandas==2.3.2",
    "radon==6.0.1",
    "seaborn==0.13.2",
]

[project.scripts]
lab02-trial = "lab02.trial_cli:main"
lab02-metrics = "lab02.metrics_cli:main"
lab02-smoke = "lab02.smoke_cli:main"
lab02-katas = "lab02.kata_runner:main"
lab02-design = "lab02.counterbalance:main"
lab02-rq12 = "lab02.rq12_analysis:main"
lab02-rq3 = "lab02.rq3_analysis:main"
lab02-dashboard = "lab02.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
