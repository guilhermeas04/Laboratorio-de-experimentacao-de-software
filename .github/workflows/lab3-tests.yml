name: LAB3 tests

on:
  push:
    paths: ["LAB3/**", ".github/workflows/lab3-tests.yml"]
  pull_request:
    paths: ["LAB3/**", ".github/workflows/lab3-tests.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LAB3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
